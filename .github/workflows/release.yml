# The release: a v* tag becomes a signed, notarised, stapled .dmg on a GitHub
# Release.
#
# This is the only workflow holding Apple credentials. `tray.yml` stays the
# pull-request check and holds none; `ci.yml` stays ubuntu. The build itself
# is one entry point — `npm run tray:build` — shared verbatim with the dev
# machine, so this file stays thin and the order of staging, signing,
# bundling, notarising and auditing lives in scripts/release-tray.ts, once.
#
# What this deliberately does not do: no auto-update feed (deferred, dated
# 2026-08-28 in docs/todo/01 item 10 — a URL the shipped binary trusts for
# new code deserves its own argued change), no universal binary (Apple
# Silicon only for now, same date, same place).

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never kill a half-notarised release

jobs:
  release:
    # Pinned rather than -latest so a runner image migration is a diff, not a
    # surprise mid-release.
    runs-on: macos-15
    # Notarisation is minutes normally and has been hours on Apple's bad days.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: The tag names the version Cargo.toml states
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml's $V"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Rust for aarch64-apple-darwin
        run: rustup target add aarch64-apple-darwin
      # `src-tauri/target` is NOT cached, and the exclusion is the point.
      #
      # At post-job time that path holds `bundle/macos/Propositum.app` — the
      # signed application, and on a build that carried one, the plaintext
      # `bundled-key` file `scripts/stage-runtime.ts` writes into
      # `Contents/Resources/runtime`. Tag-scoped caches are not readable from
      # pull-request runs, so the exposure is narrow; a live credential sitting
      # in Actions cache storage for no benefit is still not a thing to keep,
      # and re-caching a freshly signed artefact on every release buys nothing
      # either — the signature is the part that must be produced fresh.
      #
      # What is worth caching is the dependency build, which is where the time
      # goes and which carries nothing secret.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
          key: release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Import the signing certificate into a job keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Write the notary key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarise, staple, audit
        env:
          # ADR-0028: absent secret means an empty value, which the staging
          # script treats as the keyless floor — the build asks for a key.
          PROPOSITUM_BUNDLED_KEY: ${{ secrets.PROPOSITUM_BUNDLED_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # APPLE_CERTIFICATE is deliberately NOT exported to this step: with
          # it set the tauri CLI builds a second throwaway keychain; without
          # it, the CLI and scripts/sign-runtime.ts both resolve
          # APPLE_SIGNING_IDENTITY against the keychain imported above. One
          # keychain, two signers.
        run: npm run tray:build

      # A build that carries a bundled key is published as a DRAFT, and a
      # person presses publish.
      #
      # ADR-0028 accepts that the key is one `strings` away from anyone who
      # downloads the artefact, and rests the whole containment on a hard
      # monthly spend cap set by hand in the Anthropic console — outside this
      # repository, and unverifiable from it. What that argument assumes is a
      # TESTER CIRCLE: "the moment distribution is aimed at people the owner
      # has not met, this ADR's premise is spent."
      #
      # A GitHub Release page is public the instant it is created, so one tag
      # push took the artefact from a tester circle to the open internet with
      # nothing between. `--draft` is that something: the release exists, the
      # `.dmg` is attached, and it is visible only to people who can write to
      # the repository until somebody presses publish having decided the
      # circle is still the circle.
      #
      # A keyless build publishes immediately, unchanged. The condition is read
      # off `runtime-manifest.json`, which `scripts/stage-runtime.ts` writes
      # from what it actually staged — not off the secret, which would be a
      # second place the same fact is decided.
      - name: Publish the .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keyed=$(node -e "process.stdout.write(String(require('./dist-runtime/runtime/runtime-manifest.json').carriesBundledKey))")
          if [ "$keyed" = "true" ]; then
            echo "This build carries a bundled key — publishing as a DRAFT (ADR-0028 §4)."
            draft=--draft
          elif [ "$keyed" = "false" ]; then
            draft=
          else
            echo "runtime-manifest.json did not say whether a key was staged: '$keyed'" >&2
            exit 1
          fi

          # shellcheck disable=SC2086 # $draft is a single flag or empty, deliberately unquoted
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $draft \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
